# GitHub Pages 배포 — main에 푸시하면 빌드해서 https://codoly83.github.io/claudeTest/ 에 올립니다.
# 처음 한 번: 저장소 Settings > Pages > Build and deployment > Source를 "GitHub Actions"로 선택해야 합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (하위 경로 /claudeTest/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # 새로고침·직접 주소 접속(/claudeTest/dashboard 등)도 앱이 열리도록 404.html을 index.html과 같게 둠
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
